# cargo-deny configuration — advisories, license allowlist, and source policy.
# Run via `cargo deny check` (see `cargo-deny` schema: https://embarkstudios.github.io/cargo-deny/).

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates here are PROPRIETARY and never published (see
# `[package] publish = false`) — their non-SPDX license is intentional and
# shouldn't be checked against the external-dependency SPDX allowlist below.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
