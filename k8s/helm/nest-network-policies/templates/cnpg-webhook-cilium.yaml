{{- if .Values.cnpgWebhook.enabled }}
{{- /* Additive to the plain NetworkPolicies: Cilium CRD allowing kube-apiserver admission calls. */}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-cnpg-webhook
  namespace: {{ .Values.namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.cnpgWebhook.podName }}
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: {{ .Values.cnpgWebhook.port | quote }}
              protocol: TCP
{{- end }}
