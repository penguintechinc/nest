{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "nest-api.fullname" . }}
  labels:
    {{- include "nest-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name | quote }}
      namespace: {{ .Values.httpRoute.parentRef.namespace | quote }}
      {{- with .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- range .Values.httpRoute.pathPrefixes }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "nest-api.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
