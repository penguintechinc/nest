# Alpha environment - dal2alpha demo profile ("Option A"): api+controller+scheduler+valkey+
# CNPG (operator + example Cluster) + netpols; pvc/block + pvc/file on local-path.
# Disabled: csi/nodeAgent/nfs/iscsi (privileged, violate PSA restricted; node-agent is a
# separate release in nest-system), cephCluster/velero/observability (CRDs absent on dal2alpha).
# Nest CRDs ship from this chart's crds/ dir; CNPG CRDs ship in the cloudnative-pg subchart. Requires namespace `nest` with
# label gateway-access=shared-dal2a. Image tags: ghcr has beta-*/gamma-* only (no latest) - pass
# --set nest-<svc>.image.tag=... explicitly.
# NOTE: subcharts are keyed by chart name (nest-api, ...), not api/controller; only *.enabled keep the short keys.

api:
  enabled: true
nest-api:
  securityContext:
    seccompProfile:
      type: RuntimeDefault   # PSA restricted requires explicit seccomp
  httpRoute:
    enabled: true
    parentRef:
      name: shared
      namespace: gateway-system
      sectionName: https
    hostnames: ["nest-alpha.penguintech.cloud"]   # user-specified alpha domain, served on :8443 (needs a gateway listener on 8443)
  env:
    GIN_MODE: debug
    LOG_LEVEL: debug
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
controller:
  enabled: true
nest-controller:
  securityContext:
    seccompProfile:
      type: RuntimeDefault   # PSA restricted requires explicit seccomp
  env:
    LOG_LEVEL: debug
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
csi:
  enabled: false
scheduler:
  enabled: true
nodeAgent:
  enabled: false
observability:
  enabled: false
  prometheus:
    storageSize: 5Gi
    scrapeInterval: 60s
  loki:
    storageSize: 2Gi
    retention: 7d
  tempo:
    storageSize: 1Gi
    retention: 3d
  pyroscope:
    enabled: false
  otelCollector:
    sampling:
      ratio: 1.0

nfsGateway:
  enabled: false
nest-nfs-gateway:
  env:
    GIN_MODE: debug
    LOG_LEVEL: debug
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
iscsiGateway:
  enabled: false
nest-iscsi-gateway:
  env:
    GIN_MODE: debug
    LOG_LEVEL: debug
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
rgw:
  enabled: false
cephCluster:
  enabled: false   # no rook-ceph CRDs on dal2alpha
velero:
  enabled: false   # no velero CRDs on dal2alpha
cloudnativepg:
  enabled: true    # operator subchart ships its own CRDs (installed from its crds/ dir)

# Shared gateway namespace on dal2alpha + Cilium allow for kube-apiserver -> CNPG webhook (9443)
nest-network-policies:
  ingressNamespace: gateway-system
  cnpgWebhook:
    enabled: true

# Alias StorageClasses the controller defaults to (nest-block/nest-fs-rwo/nest-fs) -> local-path
storageClassAliases:
  enabled: true

# Alpha-tier overrides for the new parity subcharts (aliased by subchart name)
nest-ceph-cluster:
  cephCluster:
    mon:
      count: 1
    mgr:
      count: 1
  filesystem:
    metadataServer:
      activeStandby: false
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

nest-velero:
  schedule:
    enabled: false

nest-valkey:
  securityContext:
    seccompProfile:
      type: RuntimeDefault   # PSA restricted requires explicit seccomp
  replicaCount: 1
  storage:
    size: 512Mi
    storageClass: nest-local-retain
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# CNPG webhooks are cluster-wide (subchart exposes no namespaceSelector): Ignore so a down
# operator cannot block postgresql.cnpg.io CR writes in other namespaces on the shared cluster.
nest-cloudnativepg:
  cloudnative-pg:
    webhook:
      mutating:
        failurePolicy: Ignore
      validating:
        failurePolicy: Ignore
  exampleCluster:
    instances: 1
    storage:
      size: 1Gi
      storageClass: nest-local-retain
    backup:
      enabled: false

# Gateway API exposure via the shared dal2alpha gateway (listener https/443,
# cert cloudflare-origin-wildcard; namespace must carry label gateway-access=shared-dal2a)

nest-scheduler:
  replicaCount: 1   # no leader election yet - never run >1
  securityContext:
    seccompProfile:
      type: RuntimeDefault   # PSA restricted requires explicit seccomp
