name: Continuous Integration

on:
  push:
    # Release branches are deliberately NOT listed here. Everything reaches them
    # through a PR (devops.md: "Every branch-to-branch merge requires a PR"), and
    # that PR is gated by the pull_request trigger below, so a post-merge push run
    # would be redundant. Listing them also makes zizmor treat this as a
    # publishing workflow and flags every cache step as cache-poisoning.
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    # pull_request filters on the BASE branch. Previously only main/develop were
    # listed, so a PR into v1.2.x triggered nothing — the "merge once green" gate
    # was checking a run that never happened. PR #29 only appeared to have CI
    # because its head branch matched the feature/* push trigger above.
    branches: [ main, develop, 'release/**', 'v*.*.x' ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

# Least-privilege default for every job. Without this the workflow inherits the
# repository default, which zizmor flags as excessive-permissions. Jobs needing
# more (e.g. security, which uploads SARIF) declare their own permissions block.
permissions:
  contents: read

env:
  GO_VERSION: '1.25.14'
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

jobs:
  # Changes detection to skip unnecessary jobs
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.changes.outputs.go }}
      python: ${{ steps.changes.outputs.python }}
      node: ${{ steps.changes.outputs.node }}
      web: ${{ steps.changes.outputs.web }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # See the note on the other checkout steps: do not persist the token.
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
        id: changes
        with:
          filters: |
            go:
              - 'go.mod'
              - 'go.sum'
              - '**/*.go'
              - 'apps/api/**'
              - 'services/**'
              - 'shared/licensing/*.go'
            python:
              - 'requirements.txt'
              - '**/*.py'
              - 'apps/web/**'
              - 'shared/licensing/*.py'
            node:
              - 'package.json'
              - 'package-lock.json'
              - 'web/package.json'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
              - 'web/src/**'
            web:
              - 'web/**'
              - 'package.json'
            docs:
              - 'docs/**'
              - '**/*.md'

  # Go testing and linting
  go-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      matrix:
        go-version: ['1.25.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        # Do not leave the token in .git/config; nothing here pushes, and an
        # artifact upload of the workspace would otherwise carry the credential.
        persist-credentials: false

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      uses: dominikh/staticcheck-action@fe1dd0c3658873b46f8c9bb3291096a617310ca6  # v1.3.1
      with:
        # 2023.1.7 cannot build or run under Go 1.25 (its x/tools dependency
        # fails to compile); 2025.1.1 is the release that supports the 1.25
        # toolchain this workflow now uses.
        version: "2025.1.1"
        install-go: false

    - name: Run tests
      run: |
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Generate test report
      uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386  # v6
      if: success() || failure()
      with:
        report_paths: 'test-results.xml'

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6
      with:
        file: ./coverage.out
        flags: go-tests
        name: go-coverage

  # Python testing and linting
  python-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        # Do not leave the token in .git/config; nothing here pushes, and an
        # artifact upload of the workspace would otherwise carry the credential.
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        # Root requirements.txt is a placeholder only (see its header comment) —
        # the actual deps the pytest step below imports live per-app. Each
        # uv-compiled lockfile is installed via its own `pip install -r`
        # invocation rather than combined into one command: their hash-pinned
        # transitive deps diverge (e.g. grpcio/protobuf/alembic versions differ
        # between apps/api and apps/manager), and pip's hash-checking mode
        # requires a single fully-consistent resolution across everything
        # passed to one invocation.
        pip install -r apps/api/requirements.txt
        pip install -r apps/manager/requirements.txt
        # ruff is the single Python linter/formatter/import-sorter (replaces the
        # former black + isort + flake8). Pinned to the same version the local
        # pre-commit hook uses (.pre-commit-config.yaml) so CI and local agree.
        pip install pytest pytest-cov pytest-asyncio ruff==0.8.4 mypy

    - name: Run ruff (format check + lint)
      run: |
        # Config (rule selection, line length, target) lives in pyproject.toml,
        # so this invocation stays identical to the local pre-commit hook.
        ruff format --check .
        ruff check --output-format=github .

    - name: Run mypy (type checking)
      run: mypy . --ignore-missing-imports
      continue-on-error: true

    - name: Run tests with pytest
      run: |
        # Each service is its own pytest rootdir: apps/api and apps/manager both
        # ship a top-level `store`/`utils`/`worker` package, so collecting them
        # together from the repo root collides on sys.path (ImportError:
        # OperationStore / No module named 'utils'). Run each in its own directory,
        # which is how they are designed and how they pass locally (136 + 919).
        #
        # NOT run here: the repo-root tests/ directory (26 tests). It relies on
        # sys.path.insert hacks that break under the same collision and has never
        # actually executed in CI (the old Black step failed first and masked it).
        # Tracked as a separate fix rather than silently folded in — see the
        # fix/ci-pipeline PR description.
        set -euo pipefail
        cd apps/api
        python3 -m pytest --cov=. --cov-report=xml:"$GITHUB_WORKSPACE/coverage-api.xml" \
          --junitxml="$GITHUB_WORKSPACE/test-results-api.xml"
        cd ../manager
        python3 -m pytest --cov=. --cov-report=xml:"$GITHUB_WORKSPACE/coverage-manager.xml" \
          --junitxml="$GITHUB_WORKSPACE/test-results-manager.xml"
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/1
        LICENSE_KEY: PENG-TEST-TEST-TEST-TEST-ABCD
        PRODUCT_NAME: test-product

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6
      with:
        files: ./coverage-api.xml,./coverage-manager.xml
        flags: python-tests
        name: python-coverage

  # Node.js/Web testing and linting
  node-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.web == 'true'
    strategy:
      matrix:
        node-version: ['18', '20', '22']

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        # Do not leave the token in .git/config; nothing here pushes, and an
        # artifact upload of the workspace would otherwise carry the credential.
        persist-credentials: false

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd web && npm ci

    - name: Lint web
      run: cd web && npm run lint

    - name: Type check web
      run: cd web && npm run typecheck

    - name: Run web unit tests
      run: cd web && npm run test

    - name: Build web application
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: web-build-${{ matrix.node-version }}
        path: web/dist/

  # Integration tests
  integration-test:
    runs-on: ubuntu-latest
    needs: [go-test, python-test, node-test]
    if: always() && (needs.go-test.result == 'success' || needs.go-test.result == 'skipped') && (needs.python-test.result == 'success' || needs.python-test.result == 'skipped') && (needs.node-test.result == 'success' || needs.node-test.result == 'skipped')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: integration_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        # Do not leave the token in .git/config; nothing here pushes, and an
        # artifact upload of the workspace would otherwise carry the credential.
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        go mod download
        pip install -r apps/api/requirements.txt
        pip install -r apps/manager/requirements.txt
        npm ci
        cd web && npm ci

    - name: Build applications
      run: |
        go build -o bin/api ./apps/api
        npm run build

    - name: Start test environment
      run: |
        # Start applications in background
        ./bin/api &
        python apps/web/app.py &
        npm start &
        sleep 10
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/integration_test
        REDIS_URL: redis://localhost:6379/1
        LICENSE_KEY: PENG-TEST-TEST-TEST-TEST-ABCD
        PRODUCT_NAME: integration-test
        PORT: 8080

    - name: Run integration tests
      run: |
        # API health check
        curl -f http://localhost:8080/health
        curl -f http://localhost:8080/metrics

        # Feature endpoints (should return 403 without proper license)
        curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/analytics | grep -q "403"

        # License info endpoint
        curl -f http://localhost:8080/api/v1/features

  # End-to-end tests (Playwright drives the web frontend served by the Express BFF)
  e2e-test:
    runs-on: ubuntu-latest
    needs: node-test
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        # Do not leave the token in .git/config; nothing here pushes, and an
        # artifact upload of the workspace would otherwise carry the credential.
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install web dependencies
      run: cd web && npm ci

    - name: Install Playwright browsers
      run: cd web && npx playwright install --with-deps chromium

    # playwright.config.ts webServer builds web/dist and serves it on :3000 before the run.
    - name: Run end-to-end tests
      run: cd web && npm run test:e2e

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: playwright-report
        path: /tmp/playwright-nest/report/
        retention-days: 7
        if-no-files-found: ignore

    - name: Clean up Playwright artifacts
      if: always()
      run: rm -rf /tmp/playwright-nest

  # Security scanning
  security:
    runs-on: ubuntu-latest
    needs: changes
    # upload-sarif writes to the code-scanning API. The workflow declares no
    # permissions block, so the default token is read-only and the SARIF uploads
    # 403 even once the scan files exist.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        # Do not leave the token in .git/config; nothing here pushes, and an
        # artifact upload of the workspace would otherwise carry the credential.
        persist-credentials: false

    - name: Set up Go for gosec
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Set up Python for bandit
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # GATING: secrets detection — fails the build if any secret is found.
    # Run the gitleaks binary directly rather than gitleaks-action@v2, which
    # requires a paid GITLEAKS_LICENSE for organization-owned repos and fails
    # closed without one ("[penguintechinc] is an organization. License key is
    # required."). That failure aborted the job before gosec/Trivy ran, so their
    # SARIF files were never produced and the uploads failed too. The gate is
    # unchanged: a finding still fails the build via --exit-code 1.
    - name: Run gitleaks (secret detection)
      run: |
        curl -sSfL -o /tmp/gitleaks.tar.gz \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
        gitleaks dir . --redact --exit-code 1 --no-banner

    # Non-gating: gosec across a multi-module repo produces frequent package-load
    # noise, so it reports (SARIF -> code scanning) but does not hard-block. Go
    # vulnerability gating is handled by govulncheck below.
    - name: Run gosec (Go security scanner)
      uses: securego/gosec@223e19b8856e00f02cc67804499a83f77e208f3c  # v2.25.0
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'
      continue-on-error: true

    # GATING: Go dependency vulnerabilities.
    # golang/govulncheck-action hardcodes `go install .../govulncheck@latest`
    # in its composite action with no version-pin input, so it can't be pinned
    # through `with:`. @latest resolves to v1.8.0, which requires Go >=1.26 —
    # this job runs GO_VERSION (1.25.14), so that install fails outright. Run
    # govulncheck directly instead, pinned to v1.3.0 — the same pin the local
    # pre-commit hook uses (.pre-commit-config.yaml), which is Go-1.25
    # compatible and satisfies dependency pinning (no @latest).
    - name: Run govulncheck (Go dependency vulnerabilities)
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

    # GATING: high-severity / high-confidence Python SAST findings only (low noise).
    - name: Run bandit (Python security scanner)
      run: |
        pip install bandit[toml]
        bandit -r . \
          --severity-level high --confidence-level high \
          --exclude ./node_modules,./web/node_modules,./tests \
          --format json --output bandit-results.json

    # GATING: Python dependency vulnerabilities (root requirements.txt).
    - name: Run pip-audit (Python dependency vulnerabilities)
      uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
      with:
        inputs: requirements.txt

    # Non-gating: transitive dev-dependency advisories are noisy; report only.
    - name: Run npm audit (Node.js security scanner)
      run: |
        npm audit --audit-level=high --json > npm-audit-results.json || true
      continue-on-error: true

    # GATING: filesystem vulnerability scan — fails on HIGH/CRITICAL fixable issues.
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

    # Guard on the file existing: if the scan step above fails or is skipped the
    # SARIF is never written, and a bare `if: always()` turns one failure into two.
    - name: Upload gosec scan results
      uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
      if: always() && hashFiles('gosec-results.sarif') != ''
      with:
        sarif_file: 'gosec-results.sarif'
        category: 'gosec'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy'

    # Non-gating: no CodeQL init/autobuild step is wired for the Go build, so
    # analyze cannot reliably gate; results are uploaded for review. FLAGGED for
    # a follow-up to add a proper codeql-action/init + build step.
    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
      continue-on-error: true
      with:
        languages: 'go,python,javascript'

    # Non-gating: broad rule packs are noisy; report only.
    - name: Run Semgrep
      run: |
        pip install semgrep==1.100.0
        semgrep scan \
          --config p/security-audit \
          --config p/secrets \
          --config p/owasp-top-ten
      continue-on-error: true

  # License validation
  license-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        # Do not leave the token in .git/config; nothing here pushes, and an
        # artifact upload of the workspace would otherwise carry the credential.
        persist-credentials: false

    - name: Check license dependencies
      run: |
        # Check that license client is properly integrated
        grep -r "license.penguintech.io" . --exclude-dir=.git --exclude-dir=node_modules || true
        grep -r "PENG-" . --exclude-dir=.git --exclude-dir=node_modules || true

        # Verify license client files exist.
        # The Python client is intentionally absent: shared/licensing/python_client.py
        # was removed in 7d713e8 ("remove shared Python code replaced by penguin-libs
        # packages"). Python services consume licensing via the published
        # penguin-licensing package and apps/manager/routes/license.py, so asserting a
        # local copy here contradicts the shared-library standard.
        test -f shared/licensing/client.go
        test -f web/src/lib/license-client.js

        echo "License integration check passed"

  # Generate test report
  test-summary:
    runs-on: ubuntu-latest
    needs: [go-test, python-test, node-test, integration-test, e2e-test, security, license-check]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        # Do not leave the token in .git/config; nothing here pushes, and an
        # artifact upload of the workspace would otherwise carry the credential.
        persist-credentials: false

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8

    - name: Generate test summary
      run: |
        # Grouped redirect (one `> file`) rather than a run of `>> file` lines,
        # per shellcheck SC2129. needs.*.result is a fixed status enum, not
        # attacker-controllable, so it is safe to expand inline; the commit/branch
        # values come through env below because they are not.
        {
          echo "# Test Summary"
          echo ""
          echo "## Job Results"
          echo "- Go Tests: ${{ needs.go-test.result }}"
          echo "- Python Tests: ${{ needs.python-test.result }}"
          echo "- Node.js Tests: ${{ needs.node-test.result }}"
          echo "- Integration Tests: ${{ needs.integration-test.result }}"
          echo "- E2E Tests: ${{ needs.e2e-test.result }}"
          echo "- Security Scan: ${{ needs.security.result }}"
          echo "- License Check: ${{ needs.license-check.result }}"
          echo ""
          echo "**Commit:** $COMMIT_SHA"
          echo "**Branch:** $BRANCH_NAME"
          echo "**Workflow Run:** #$RUN_NUMBER"
        } > test-summary.md
      env:
        # Passed through the environment rather than expanded into the script:
        # a branch named `$(...)` would otherwise execute during expansion.
        COMMIT_SHA: ${{ github.sha }}
        BRANCH_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}

    - name: Upload test summary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: test-summary
        path: test-summary.md

    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('test-summary.md', 'utf8');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

    - name: Fail if any required job failed
      if: needs.go-test.result == 'failure' || needs.python-test.result == 'failure' || needs.node-test.result == 'failure' || needs.integration-test.result == 'failure' || needs.e2e-test.result == 'failure'
      run: |
        echo "One or more required tests failed"
        exit 1
